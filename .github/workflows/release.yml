name: Release DMG

# 触发：推送形如 v1.0.0 的 tag 时自动构建并发布
on:
  push:
    tags:
      - 'v*'

# 需要写权限，否则 softprops/action-gh-release 创建 Release 会 403。
# 若仓库默认是 Read-only，请到仓库 Settings -> Actions -> Workflow permissions 改为 Read and write。
permissions:
  contents: write

jobs:
  build-dmg:
    name: Build, sign, notarize and release DMG (universal)
    runs-on: macos-15   # Apple Silicon runner，自带 Xcode/Swift，可交叉编译 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apple signing certificate
        # 仅在配置了 BUILD_CERTIFICATE_BASE64 时，把 Developer ID Application 证书(p12)安装到临时 keychain；
        # 未配置则跳过（make-dmg.sh 会回退 ad-hoc 签名）。
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "未配置 BUILD_CERTIFICATE_BASE64，跳过证书安装（将使用 ad-hoc 签名）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # 允许 codesign 在不弹密码的情况下使用密钥
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build, sign, notarize and package DMG
        # 仅注入公证所需的三件套；签名标识(SIGN_ID)由 make-dmg.sh 从已安装钥匙串自动选取，无需配置 Secret。
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./make-dmg.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动从本次 tag 的提交生成 Release 说明
          generate_release_notes: true
          # 上传 make-dmg.sh 产出的 dmg（已含公证票据）
          files: build/CrossTerminal-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
